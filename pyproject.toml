[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "rapidocrlite"
version = "5.0.0a15"
description = "RapidOCRLite: lightweight, fast PP-OCRv6 native engine, API-compatible with RapidOCR; import name rapidocr"
readme = "python/README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "SWHL", email = "liekkaskono@163.com" }]
keywords = ["ocr", "ppocr", "ppocrv6", "rapidocr"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C++",
]
dependencies = [
    "numpy>=1.21",
    "Pillow>=9.0",
    "PyYAML>=6.0",
    "requests",
    "tqdm",
]

[project.optional-dependencies]
# PPOCR_INDRA_BACKEND=ort test reference only (upstream indra-ocr); model_type="lite" itself runs in the C++ engine
lite = ["onnxruntime>=1.17", "opencv-python-headless", "indra-ocr==0.3.2"]

[project.urls]
Documentation = "https://rapidai.github.io/RapidOCRDocs"
Repository = "https://github.com/RapidAI/RapidOCRLite"

[project.scripts]
rapidocr = "rapidocr.main:main"

[tool.scikit-build]
cmake.source-dir = "."
cmake.build-type = "Release"
cmake.args = ["-DPPOCR_BUILD_EXAMPLES=OFF", "-DPPOCR_BUILD_TESTS=OFF", "-DPPOCR_ENABLE_VULKAN=OFF"]
wheel.packages = ["python/src/rapidocr"]
minimum-version = "0.10"

[tool.scikit-build.cmake.define]
PPOCR_BUILD_SHARED = "ON"
PPOCR_BUILD_STATIC = "OFF"
PPOCR_ENABLE_VULKAN = "OFF"

[tool.scikit-build.sdist]
exclude = [
    "third_party/**",
    "build*/**",
    ".git/**",
    "python/.pytest_cache/**",
    "ci-models/**",
    "wheelhouse/**",
    "dist/**",
]

# Official PyPA manylinux2014 (glibc 2.17, devtoolset GCC 10). The native
# library is ctypes-loaded, so each CPython wheel is a retag of the same build.
[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = "pp* *-musllinux_* *i686 *-win32 *-win_amd64 *-macosx_*"
archs = ["x86_64", "aarch64"]
manylinux-x86_64-image = "manylinux2014"
manylinux-aarch64-image = "manylinux2014"
test-requires = ["pytest"]
test-command = "bash {project}/python/tests/ci_wheel_check.sh"

[tool.cibuildwheel.linux]
environment = { CMAKE_ARGS = "-DPPOCR_BUILD_EXAMPLES=OFF -DPPOCR_BUILD_TESTS=OFF -DPPOCR_BUILD_STATIC=OFF -DPPOCR_BUILD_SHARED=ON -DPPOCR_ENABLE_VULKAN=OFF", CMAKE_BUILD_PARALLEL_LEVEL = "4", PIP_CONSTRAINT = "/project/python/tests/ci-constraints.txt" }

# macOS wheels are built by dedicated jobs (wheels-macos-arm64 on macos-14 and
# wheels-macos-x86_64 on macos-15-intel), which override `skip` above.
[tool.cibuildwheel.windows]
archs = ["AMD64", "x86"]
environment = { CMAKE_ARGS = "-DPPOCR_BUILD_EXAMPLES=OFF -DPPOCR_BUILD_TESTS=OFF -DPPOCR_BUILD_STATIC=OFF -DPPOCR_BUILD_SHARED=ON -DPPOCR_ENABLE_VULKAN=ON -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded", CMAKE_BUILD_PARALLEL_LEVEL = "4", SKBUILD_BUILD_VERBOSE = "true", PPOCR_CHECK_SCALAR = "1" }
test-requires = ["pytest", "pillow"]
test-command = "python {project}/python/tests/ci_wheel_check.py && python {project}/python/tests/ci_lite_examples_check.py --matrix"

# macOS wheels are built by two jobs (wheels-macos-arm64 on macos-14,
# wheels-macos-x86_64 on macos-15-intel), which override `skip` above. Metal is
# on: glslang and spirv-cross are build tools only; the wheel needs nothing
# beyond Metal.framework at runtime. CMAKE_OSX_ARCHITECTURES /
# CMAKE_OSX_DEPLOYMENT_TARGET are deliberately NOT in CMAKE_ARGS: cibuildwheel
# exports the former per wheel arch, and hardcoding arm64 here silently
# mis-built the Intel wheels. MACOSX_DEPLOYMENT_TARGET is NOT set here either:
# the config environment would override the job-level value for both arches.
# It lives in the two jobs in release.yml (14.0 arm64 / 11.0 x86_64), and
# CMake reads it from the environment (Platform/Darwin-Initialize.cmake), so it
# also drives the wheel tag and the vtool minos check.
[tool.cibuildwheel.macos]
archs = ["arm64", "x86_64"]
before-all = "brew install glslang spirv-cross"
environment = { CMAKE_ARGS = "-DPPOCR_BUILD_EXAMPLES=OFF -DPPOCR_BUILD_TESTS=OFF -DPPOCR_BUILD_STATIC=OFF -DPPOCR_BUILD_SHARED=ON -DPPOCR_ENABLE_VULKAN=OFF -DPPOCR_ENABLE_METAL=ON -DPPOCR_REQUIRE_METAL=ON", CMAKE_BUILD_PARALLEL_LEVEL = "3", SKBUILD_LOGGING_LEVEL = "INFO", SKBUILD_BUILD_VERBOSE = "true" }
test-command = "bash {project}/python/tests/ci_wheel_check_macos.sh"

# Intel wheel specifics live in the wheels-macos-x86_64 job in release.yml
# (MACOSX_DEPLOYMENT_TARGET=11.0 for older Macs plus the MACOS_CHECK_* knobs
# read by ci_wheel_check_macos.sh). They are deliberately NOT a cibuildwheel
# override here: a plain x86_64 wheel's build identifier is
# "cp312-macosx_x86_64" (the ":arch" suffix only exists for universal2), so
# select = "*-macosx_x86_64:*" never matched anything; and even a correct
# selector would not help, because an override's environment table REPLACES the
# platform one (InheritRule.NONE, see cibuildwheel/options.py), silently
# dropping CMAKE_ARGS and with it the whole Metal build.
