name: word box parity

# return_word_box / return_single_char_box parity with rapidocr main
# (RapidAI/RapidOCR @ 558f5660, #756; word scores per #750): build the CPU library, check the
# cal_rec_boxes port against main's code and OpenCV, then run RapidOCRLite
# and pip-installed rapidocr main on main's word-box test pages
# (python/tests/test_files), the SWHL text_det pages (word and single-char
# mode) and the SWHL text_rec crops (use_det=False WordInfo), and require
# identical words and boxes.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: word-box-parity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RAPIDOCR_MAIN_REF: 558f56606960fb5ced10c759a6b01f796451e659

jobs:
  parity:
    name: return_word_box parity vs rapidocr main
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build cmake g++

      - name: Cache tiny models
        uses: actions/cache@v4
        with:
          path: ci-models
          key: rapidocr-ci-models-tiny-v1

      - name: Download tiny models when the cache is empty
        run: python python/tests/fetch_ci_models.py

      - name: Build the CPU library
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPPOCR_BUILD_STATIC=OFF -DPPOCR_BUILD_SHARED=ON \
            -DPPOCR_BUILD_TESTS=ON -DPPOCR_BUILD_EXAMPLES=OFF \
            -DPPOCR_ENABLE_VULKAN=OFF
          cmake --build build -j"$(nproc)"
          (cd build && ctest -R c_api_smoke --output-on-failure)

      - name: Python environments
        run: |
          python -m venv /tmp/lite
          /tmp/lite/bin/pip install -q numpy Pillow PyYAML requests tqdm pytest datasets
          python -m venv /tmp/main
          /tmp/main/bin/pip install -q "rapidocr @ git+https://github.com/RapidAI/RapidOCR@${RAPIDOCR_MAIN_REF}#subdirectory=python" onnxruntime datasets
          git init -q /tmp/main-src && cd /tmp/main-src
          git remote add origin https://github.com/RapidAI/RapidOCR.git
          git fetch -q --depth 1 origin "${RAPIDOCR_MAIN_REF}"
          git checkout -q FETCH_HEAD -- python/tests/test_files
          mkdir -p /tmp/word-pages
          for f in check_return_word_len.jpeg text_vertical_words.png issue_170.png return_word_debug.jpg \
                   ch_en_num.jpg en.jpg text_det.jpg ch_doc_server.png japan.jpg korean.jpg short.png; do
            cp "python/tests/test_files/$f" /tmp/word-pages/ || echo "missing $f"
          done
          ls /tmp/word-pages

      - name: Library info
        run: echo "PPOCR_LIBRARY=$PWD/build/librapidocrlite.so" >> "$GITHUB_ENV"

      - name: pytest (word boxes + compat) with the tiny models
        env:
          PYTHONPATH: python/src
          PPOCR_TEST_IMAGE: python/tests/data/hello.png
          PPOCR_TEST_DET: ci-models/PP-OCRv6_det_tiny.onnx
          PPOCR_TEST_REC: ci-models/PP-OCRv6_rec_tiny.onnx
          PPOCR_TEST_DICT: ci-models/ppocrv6_tiny_dict.txt
          PPOCR_CLS_MODEL: ci-models/ch_ppocr_mobile_v2.0_cls_mobile.onnx
        run: /tmp/lite/bin/python -m pytest -q python/tests/test_word_box.py python/tests/test_word_box_cls_rotation.py python/tests/test_main_compat.py

      - name: cal_rec_boxes port vs main's code and OpenCV
        run: /tmp/main/bin/python tools/word_parity/port_check.py python/src/rapidocr/cal_rec_boxes.py

      - name: rapidocr main reference
        run: |
          mkdir -p parity
          /tmp/main/bin/python tools/word_parity/eval_words.py parity/main.json --extra /tmp/word-pages --model-root /tmp/models-main

      - name: RapidOCRLite (native ISA, AVX2)
        env:
          PYTHONPATH: python/src
        run: |
          /tmp/lite/bin/python tools/word_parity/eval_words.py parity/lite.json --extra /tmp/word-pages --model-root /tmp/models-lite
          PPOCR_FORCE_ISA=avx2 /tmp/lite/bin/python tools/word_parity/eval_words.py parity/lite_avx2.json --extra /tmp/word-pages --limit-det 60 --limit-rec 100 --model-root /tmp/models-lite

      - name: Compare
        run: |
          # rapidocr main (onnxruntime) itself picks kernels per CPU: on some
          # AVX-512 hosts its det boxes move by 1px on near-threshold pages
          # (det/75). The hard gate therefore uses a CPU-independent reference:
          # Lite forced-AVX2 vs main's AVX2-host result (live main on non-AVX-512
          # runners, else the pinned tools/word_parity/ref/main_avx2.json.gz from
          # an AMD EPYC 7763 run, moved to cee004f9 by applying main #747's
          # word-box changes on its 70 cls-rotated lines, then to 558f5660 by
          # applying main #750's per-word confidences). Native AVX-512
          # vs live main is reported, and only tolerates up to 2 det 1px pages.
          set -o pipefail
          REF=tools/word_parity/ref/main_avx2.json.gz
          AVX512=no; grep -q avx512f /proc/cpuinfo && AVX512=yes
          [ "$AVX512" = no ] && REF=parity/main.json
          {
            echo "CPU: $(lscpu | sed -n 's/^Model name: *//p'), AVX-512: $AVX512, AVX2 reference: $REF"
            echo "### rapidocr main vs RapidOCRLite (native ISA, report)"
            /tmp/main/bin/python tools/word_parity/compare_words.py parity/main.json parity/lite.json || true
            echo "### AVX2 reference vs RapidOCRLite (forced AVX2, first 60 pages / 100 crops)"
            /tmp/main/bin/python tools/word_parity/compare_words.py "$REF" parity/lite_avx2.json --subset || true
          } | tee parity/summary.txt
          echo '```' >> "$GITHUB_STEP_SUMMARY"; cat parity/summary.txt >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
          /tmp/main/bin/python tools/word_parity/compare_words.py "$REF" parity/lite_avx2.json --strict --subset --max-word-diffs 4
          if [ "$AVX512" = no ]; then
            /tmp/main/bin/python tools/word_parity/compare_words.py tools/word_parity/ref/main_avx2.json.gz parity/main.json --strict --subset
            /tmp/main/bin/python tools/word_parity/compare_words.py parity/main.json parity/lite.json --strict --max-word-diffs 4
          else
            /tmp/main/bin/python tools/word_parity/compare_words.py parity/main.json parity/lite.json --strict --max-word-diffs 4 --det-1px-pages 2
          fi

      - name: Engine word boxes (C / C++ / Java) vs the Python port, CPU and lite model
        env:
          PYTHONPATH: python/src
        run: |
          set -o pipefail
          {
            /tmp/lite/bin/python tools/word_parity/c_words_check.py --label "[cpu]" --extra /tmp/word-pages \
              --limit-det 120 --param Global.model_root_dir=/tmp/models-lite
            /tmp/lite/bin/python tools/word_parity/c_words_check.py --label "[lite model]" --extra /tmp/word-pages \
              --limit-det 120 --param Det.model_type=lite Rec.model_type=lite
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Lite model word boxes (word_results through the Python API)
        env:
          PYTHONPATH: python/src
        run: |
          /tmp/lite/bin/python tools/word_parity/eval_words.py parity/litemodel.json --extra /tmp/word-pages \
            --limit-det 40 --limit-rec 40 --param Det.model_type=lite Rec.model_type=lite
          /tmp/lite/bin/python tools/word_parity/check_words_sane.py parity/litemodel.json | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: word-box-parity
          path: parity/

  vulkan:
    name: return_word_box on the strict Vulkan GPU-only graph (lavapipe) vs CPU
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Toolchain and the software Vulkan stack
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build cmake g++ \
            mesa-vulkan-drivers vulkan-tools glslang-tools
      - name: Build with Vulkan
        run: |
          cmake -S . -B build-vk -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPPOCR_BUILD_STATIC=OFF -DPPOCR_BUILD_SHARED=ON \
            -DPPOCR_BUILD_TESTS=OFF -DPPOCR_BUILD_EXAMPLES=OFF \
            -DPPOCR_ENABLE_VULKAN=ON
          cmake --build build-vk -j"$(nproc)"
          echo "PPOCR_LIBRARY=$PWD/build-vk/librapidocrlite.so" >> "$GITHUB_ENV"
      - name: Python and pages
        run: |
          python -m venv /tmp/lite
          /tmp/lite/bin/pip install -q numpy Pillow PyYAML requests tqdm datasets
          git init -q /tmp/main-src && cd /tmp/main-src
          git remote add origin https://github.com/RapidAI/RapidOCR.git
          git fetch -q --depth 1 origin "${RAPIDOCR_MAIN_REF}"
          git checkout -q FETCH_HEAD -- python/tests/test_files
          mkdir -p /tmp/word-pages
          for f in check_return_word_len.jpeg text_vertical_words.png issue_170.png return_word_debug.jpg \
                   ch_en_num.jpg en.jpg text_det.jpg ch_doc_server.png japan.jpg korean.jpg short.png; do
            cp "python/tests/test_files/$f" /tmp/word-pages/ || echo "missing $f"
          done
      - name: CPU and GPU-only word boxes (exact front end)
        env:
          PYTHONPATH: python/src
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
          PPOCR_VULKAN_DEVICE_INDEX: "0"
        run: |
          mkdir -p parity
          /tmp/lite/bin/python tools/word_parity/eval_words.py parity/cpu.json --extra /tmp/word-pages --limit-det 40 --no-rec --model-root /tmp/models-lite
          s=$(date +%s); /tmp/lite/bin/python tools/word_parity/eval_words.py parity/gpu.json --extra /tmp/word-pages --limit-det 40 --no-rec --model-root /tmp/models-lite \
            --param EngineConfig.ppocr_cpp.backend=gpu Global.log_level=info
          echo "GPU-only exact front end: $(( $(date +%s) - s )) s for the CPU-dump page set (lavapipe)" | tee parity/vk_time.txt
          {
            echo "### strict Vulkan GPU-only graph vs CPU (must be identical)"
            cat parity/vk_time.txt
            /tmp/lite/bin/python tools/word_parity/compare_backends.py --exact --label "[vulkan gpu-only] " parity/cpu.json parity/gpu.json | tail -20 || true
          } | tee -a "$GITHUB_STEP_SUMMARY"
          /tmp/lite/bin/python tools/word_parity/compare_backends.py --exact parity/cpu.json parity/gpu.json > /dev/null
          /tmp/lite/bin/python tools/word_parity/c_words_check.py --label "[vulkan gpu-only]" --extra /tmp/word-pages \
            --limit-det 40 --param Global.model_root_dir=/tmp/models-lite EngineConfig.ppocr_cpp.backend=gpu \
            | tee -a "$GITHUB_STEP_SUMMARY"; test "${PIPESTATUS[0]}" = 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: word-box-parity-vulkan
          path: parity/

  vulkan-hybrid:
    name: return_word_box on hybrid (lavapipe) vs CPU, and the legacy GPU-only device front end
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Toolchain and the software Vulkan stack
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build cmake g++ \
            mesa-vulkan-drivers vulkan-tools glslang-tools
      - name: Build with Vulkan
        run: |
          cmake -S . -B build-vk -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPPOCR_BUILD_STATIC=OFF -DPPOCR_BUILD_SHARED=ON \
            -DPPOCR_BUILD_TESTS=OFF -DPPOCR_BUILD_EXAMPLES=OFF \
            -DPPOCR_ENABLE_VULKAN=ON
          cmake --build build-vk -j"$(nproc)"
          echo "PPOCR_LIBRARY=$PWD/build-vk/librapidocrlite.so" >> "$GITHUB_ENV"
      - name: Python and pages
        run: |
          python -m venv /tmp/lite
          /tmp/lite/bin/pip install -q numpy Pillow PyYAML requests tqdm datasets
          git init -q /tmp/main-src && cd /tmp/main-src
          git remote add origin https://github.com/RapidAI/RapidOCR.git
          git fetch -q --depth 1 origin "${RAPIDOCR_MAIN_REF}"
          git checkout -q FETCH_HEAD -- python/tests/test_files
          mkdir -p /tmp/word-pages
          for f in check_return_word_len.jpeg text_vertical_words.png issue_170.png return_word_debug.jpg \
                   ch_en_num.jpg en.jpg text_det.jpg ch_doc_server.png japan.jpg korean.jpg short.png; do
            cp "python/tests/test_files/$f" /tmp/word-pages/ || echo "missing $f"
          done
      - name: Hybrid exact; legacy GPU-only device front end (timing, informational)
        env:
          PYTHONPATH: python/src
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
          PPOCR_VULKAN_DEVICE_INDEX: "0"
        run: |
          mkdir -p parity
          /tmp/lite/bin/python tools/word_parity/eval_words.py parity/cpu.json --extra /tmp/word-pages --limit-det 40 --no-rec --model-root /tmp/models-lite
          /tmp/lite/bin/python tools/word_parity/eval_words.py parity/hybrid.json --extra /tmp/word-pages --limit-det 40 --no-rec --model-root /tmp/models-lite --param EngineConfig.ppocr_cpp.backend=hybrid
          s=$(date +%s); PPOCR_VULKAN_DEVICE_FRONTEND=1 /tmp/lite/bin/python tools/word_parity/eval_words.py parity/gpu_legacy.json --extra /tmp/word-pages --limit-det 40 --no-rec --model-root /tmp/models-lite \
            --param EngineConfig.ppocr_cpp.backend=gpu
          echo "GPU-only legacy device front end (PPOCR_VULKAN_DEVICE_FRONTEND=1): $(( $(date +%s) - s )) s (lavapipe)" | tee parity/vk_legacy_time.txt
          {
            echo "### hybrid vs CPU (must be identical)"
            /tmp/lite/bin/python tools/word_parity/compare_backends.py --exact --label "[hybrid] " parity/cpu.json parity/hybrid.json | tail -20 || true
            echo "### legacy GPU-only device front end vs CPU (informational)"
            cat parity/vk_legacy_time.txt
            /tmp/lite/bin/python tools/word_parity/compare_backends.py parity/cpu.json parity/gpu_legacy.json || true
          } | tee -a "$GITHUB_STEP_SUMMARY"
          /tmp/lite/bin/python tools/word_parity/compare_backends.py --exact parity/cpu.json parity/hybrid.json > /dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: word-box-parity-hybrid
          path: parity/

  metal:
    name: return_word_box on Metal (macos-14) vs CPU
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build with Metal
        run: |
          brew install glslang spirv-cross ninja
          cmake -S . -B build-metal -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPPOCR_BUILD_STATIC=OFF -DPPOCR_BUILD_SHARED=ON -DPPOCR_BUILD_TESTS=OFF \
            -DPPOCR_BUILD_EXAMPLES=OFF -DPPOCR_ENABLE_VULKAN=OFF -DPPOCR_ENABLE_METAL=ON
          cmake --build build-metal -j"$(sysctl -n hw.ncpu)"
          echo "PPOCR_LIBRARY=$(ls $PWD/build-metal/librapidocrlite*.dylib | head -1)" >> "$GITHUB_ENV"
      - name: Python and pages
        run: |
          python -m venv /tmp/lite
          /tmp/lite/bin/pip install -q numpy Pillow PyYAML requests tqdm datasets
          git init -q /tmp/main-src && cd /tmp/main-src
          git remote add origin https://github.com/RapidAI/RapidOCR.git
          git fetch -q --depth 1 origin "${RAPIDOCR_MAIN_REF}"
          git checkout -q FETCH_HEAD -- python/tests/test_files
          mkdir -p /tmp/word-pages
          for f in check_return_word_len.jpeg text_vertical_words.png issue_170.png return_word_debug.jpg \
                   ch_en_num.jpg en.jpg text_det.jpg ch_doc_server.png japan.jpg korean.jpg short.png; do
            cp "python/tests/test_files/$f" /tmp/word-pages/ || echo "missing $f"
          done
      - name: CPU and Metal word boxes
        env:
          PYTHONPATH: python/src
        run: |
          mkdir -p parity
          /tmp/lite/bin/python tools/word_parity/eval_words.py parity/cpu.json --extra /tmp/word-pages --limit-det 40 --no-rec --model-root /tmp/models-lite
          /tmp/lite/bin/python tools/word_parity/eval_words.py parity/metal.json --extra /tmp/word-pages --limit-det 40 --no-rec --model-root /tmp/models-lite --param EngineConfig.ppocr_cpp.backend=metal Global.log_level=info
          {
            echo "### Metal vs CPU (must be identical)"
            /tmp/lite/bin/python tools/word_parity/compare_backends.py --exact --label "[metal] " parity/cpu.json parity/metal.json | tail -20 || true
          } | tee -a "$GITHUB_STEP_SUMMARY"
          /tmp/lite/bin/python tools/word_parity/compare_backends.py --exact parity/cpu.json parity/metal.json > /dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: word-box-parity-metal
          path: parity/
