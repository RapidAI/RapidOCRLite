name: build sdk

on:
  push:
    branches: [main]
    tags: ["v5*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "If set, upload SDK archives to this existing GitHub Release tag (e.g. v5.0.0a6)"
        required: false
        default: ""

concurrency:
  group: sdk-${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.release_tag || 'none' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sdk-windows-x64:
    name: SDK Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        shell: bash
        run: choco install ninja -y

      - name: Build and package SDK
        shell: bash
        run: |
          set -euo pipefail
          VER=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/prefix" \
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded \
            -DPPOCR_BUILD_SHARED=ON \
            -DPPOCR_BUILD_STATIC=ON \
            -DPPOCR_BUILD_EXAMPLES=OFF \
            -DPPOCR_BUILD_TESTS=OFF \
            -DPPOCR_ENABLE_VULKAN=ON \
            -DPPOCR_ENABLE_METAL=OFF
          cmake --build build -j"$(nproc 2>/dev/null || echo 4)"
          cmake --install build
          NAME="RapidOCRLite-SDK-win_amd64-${VER}"
          mkdir -p dist
          mv prefix "$NAME"
          python tools/zip_dir.py "$NAME" "dist/${NAME}.zip"
          ls -la dist
          test -f "dist/${NAME}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: rapidocrlite-sdk-win_amd64
          path: dist/*.zip
          if-no-files-found: error

  sdk-windows-x86:
    name: SDK Windows x86 (win32)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Install Ninja
        shell: bash
        run: choco install ninja -y

      - name: Build and package SDK
        shell: bash
        run: |
          set -euo pipefail
          VER=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/prefix" \
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded \
            -DPPOCR_BUILD_SHARED=ON \
            -DPPOCR_BUILD_STATIC=ON \
            -DPPOCR_BUILD_EXAMPLES=OFF \
            -DPPOCR_BUILD_TESTS=OFF \
            -DPPOCR_ENABLE_VULKAN=ON \
            -DPPOCR_ENABLE_METAL=OFF
          cmake --build build -j"$(nproc 2>/dev/null || echo 4)"
          cmake --install build
          NAME="RapidOCRLite-SDK-win32-${VER}"
          mkdir -p dist
          mv prefix "$NAME"
          python tools/zip_dir.py "$NAME" "dist/${NAME}.zip"
          ls -la dist
          test -f "dist/${NAME}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: rapidocrlite-sdk-win32
          path: dist/*.zip
          if-no-files-found: error

  sdk-macos-arm64:
    name: SDK macOS arm64 (Metal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install shader tools
        run: brew install glslang spirv-cross ninja

      - name: Build and package SDK
        run: |
          set -euo pipefail
          VER=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/prefix" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DPPOCR_BUILD_SHARED=ON \
            -DPPOCR_BUILD_STATIC=ON \
            -DPPOCR_BUILD_EXAMPLES=OFF \
            -DPPOCR_BUILD_TESTS=OFF \
            -DPPOCR_ENABLE_VULKAN=OFF \
            -DPPOCR_ENABLE_METAL=ON \
            -DPPOCR_REQUIRE_METAL=ON | tee configure.log
          grep -q "Metal backend enabled" configure.log
          cmake --build build -j"$(sysctl -n hw.ncpu)"
          cmake --install build
          NAME="RapidOCRLite-SDK-macosx_arm64-${VER}"
          mkdir -p dist
          mv prefix "$NAME"
          tar -czf "dist/${NAME}.tar.gz" "$NAME"
          ls -la dist
          test -f "dist/${NAME}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: rapidocrlite-sdk-macosx_arm64
          path: dist/*.tar.gz
          if-no-files-found: error



  sdk-linux-x86_64:
    name: SDK Linux x86_64 (manylinux2014)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build and package SDK in manylinux2014
        run: |
          set -euo pipefail
          IMAGE=quay.io/pypa/manylinux2014_x86_64:2025.03.23-1
          docker run --rm -v "$PWD":/io -w /io "$IMAGE" bash -c '
            set -euo pipefail
            PYBIN=/opt/python/cp312-cp312/bin
            test -x "$PYBIN/python"
            VER=$("$PYBIN/python" -c "import tomllib; print(tomllib.load(open(\"pyproject.toml\",\"rb\"))[\"project\"][\"version\"])")
            yum install -y zip
            # ninja-build is missing on some manylinux2014_aarch64 repos; Makefiles are fine.
            cmake -S . -B build \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/io/prefix \
              -DCMAKE_INSTALL_LIBDIR=lib \
              -DPPOCR_BUILD_SHARED=ON \
              -DPPOCR_BUILD_STATIC=ON \
              -DPPOCR_BUILD_EXAMPLES=OFF \
              -DPPOCR_BUILD_TESTS=OFF \
              -DPPOCR_ENABLE_VULKAN=OFF \
              -DPPOCR_ENABLE_METAL=OFF
            cmake --build build -j"$(nproc)"
            cmake --install build
            NAME="RapidOCRLite-SDK-linux_x86_64-${VER}"
            mkdir -p dist
            rm -rf "$NAME"
            mv prefix "$NAME"
            tar -czf "dist/${NAME}.tar.gz" "$NAME"
            zip -qry "dist/${NAME}.zip" "$NAME"
            so=$(find "$NAME" -name "librapidocrlite.so*" | head -1)
            test -n "$so"
            file "$so"
            if readelf -V "$so" 2>/dev/null | grep -E "GLIBC_2\.(1[89]|[2-9][0-9])"; then
              echo "SDK linked against glibc newer than 2.17" >&2
              exit 1
            fi
            if nm "$NAME/lib/librapidocrlite.a" "$NAME/lib/librapidocrlite.so" 2>/dev/null | grep "_finite"; then
              echo "SDK references glibc __*_finite symbols (unlinkable on glibc >= 2.31)" >&2
              exit 1
            fi
            ls -la dist
          '

      - uses: actions/upload-artifact@v4
        with:
          name: rapidocrlite-sdk-linux_x86_64
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  sdk-linux-aarch64:
    name: SDK Linux aarch64 (manylinux2014)
    runs-on: ubuntu-24.04-arm
    outputs:
      started: ${{ steps.mark.outputs.started }}
    steps:
      - name: Mark the native ARM runner as available
        id: mark
        run: echo "started=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build and package SDK in manylinux2014 aarch64
        run: |
          set -euo pipefail
          IMAGE=quay.io/pypa/manylinux2014_aarch64:2025.03.23-1
          docker run --rm -v "$PWD":/io -w /io "$IMAGE" bash -c '
            set -euo pipefail
            PYBIN=/opt/python/cp312-cp312/bin
            test -x "$PYBIN/python"
            VER=$("$PYBIN/python" -c "import tomllib; print(tomllib.load(open(\"pyproject.toml\",\"rb\"))[\"project\"][\"version\"])")
            yum install -y zip
            # ninja-build is missing on some manylinux2014_aarch64 repos; Makefiles are fine.
            cmake -S . -B build \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/io/prefix \
              -DCMAKE_INSTALL_LIBDIR=lib \
              -DPPOCR_BUILD_SHARED=ON \
              -DPPOCR_BUILD_STATIC=ON \
              -DPPOCR_BUILD_EXAMPLES=OFF \
              -DPPOCR_BUILD_TESTS=OFF \
              -DPPOCR_ENABLE_VULKAN=OFF \
              -DPPOCR_ENABLE_METAL=OFF
            cmake --build build -j"$(nproc)"
            cmake --install build
            NAME="RapidOCRLite-SDK-linux_aarch64-${VER}"
            mkdir -p dist
            rm -rf "$NAME"
            mv prefix "$NAME"
            tar -czf "dist/${NAME}.tar.gz" "$NAME"
            zip -qry "dist/${NAME}.zip" "$NAME"
            so=$(find "$NAME" -name "librapidocrlite.so*" | head -1)
            test -n "$so"
            file "$so"
            if readelf -V "$so" 2>/dev/null | grep -E "GLIBC_2\.(1[89]|[2-9][0-9])"; then
              echo "SDK linked against glibc newer than 2.17" >&2
              exit 1
            fi
            if nm "$NAME/lib/librapidocrlite.a" "$NAME/lib/librapidocrlite.so" 2>/dev/null | grep "_finite"; then
              echo "SDK references glibc __*_finite symbols (unlinkable on glibc >= 2.31)" >&2
              exit 1
            fi
            ls -la dist
          '

      - uses: actions/upload-artifact@v4
        with:
          name: rapidocrlite-sdk-linux_aarch64
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  sdk-linux-aarch64-qemu:
    name: SDK Linux aarch64 qemu
    needs: sdk-linux-aarch64
    if: >-
      always() &&
      needs.sdk-linux-aarch64.result == 'failure' &&
      needs.sdk-linux-aarch64.outputs.started != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: QEMU for aarch64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build and package SDK in manylinux2014 aarch64 (QEMU)
        run: |
          set -euo pipefail
          IMAGE=quay.io/pypa/manylinux2014_aarch64:2025.03.23-1
          docker run --rm --platform linux/arm64 -v "$PWD":/io -w /io "$IMAGE" bash -c '
            set -euo pipefail
            PYBIN=/opt/python/cp312-cp312/bin
            test -x "$PYBIN/python"
            VER=$("$PYBIN/python" -c "import tomllib; print(tomllib.load(open(\"pyproject.toml\",\"rb\"))[\"project\"][\"version\"])")
            yum install -y zip
            # ninja-build is missing on some manylinux2014_aarch64 repos; Makefiles are fine.
            cmake -S . -B build \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/io/prefix \
              -DCMAKE_INSTALL_LIBDIR=lib \
              -DPPOCR_BUILD_SHARED=ON \
              -DPPOCR_BUILD_STATIC=ON \
              -DPPOCR_BUILD_EXAMPLES=OFF \
              -DPPOCR_BUILD_TESTS=OFF \
              -DPPOCR_ENABLE_VULKAN=OFF \
              -DPPOCR_ENABLE_METAL=OFF
            cmake --build build -j"$(nproc)"
            cmake --install build
            NAME="RapidOCRLite-SDK-linux_aarch64-${VER}"
            mkdir -p dist
            rm -rf "$NAME"
            mv prefix "$NAME"
            tar -czf "dist/${NAME}.tar.gz" "$NAME"
            zip -qry "dist/${NAME}.zip" "$NAME"
            so=$(find "$NAME" -name "librapidocrlite.so*" | head -1)
            test -n "$so"
            file "$so"
            if readelf -V "$so" 2>/dev/null | grep -E "GLIBC_2\.(1[89]|[2-9][0-9])"; then
              echo "SDK linked against glibc newer than 2.17" >&2
              exit 1
            fi
            if nm "$NAME/lib/librapidocrlite.a" "$NAME/lib/librapidocrlite.so" 2>/dev/null | grep "_finite"; then
              echo "SDK references glibc __*_finite symbols (unlinkable on glibc >= 2.31)" >&2
              exit 1
            fi
            ls -la dist
          '

      - uses: actions/upload-artifact@v4
        with:
          name: rapidocrlite-sdk-linux_aarch64
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  sdk-smoke:
    name: SDK smoke ${{ matrix.plat }} (${{ matrix.link }})
    needs: [sdk-windows-x64, sdk-macos-arm64, sdk-linux-x86_64]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { plat: linux_x86_64, os: ubuntu-latest, ext: tar.gz, link: shared }
          - { plat: linux_x86_64, os: ubuntu-latest, ext: tar.gz, link: static }
          - { plat: win_amd64, os: windows-latest, ext: zip, link: shared }
          - { plat: win_amd64, os: windows-latest, ext: zip, link: static }
          - { plat: macosx_arm64, os: macos-14, ext: tar.gz, link: shared }
          - { plat: macosx_arm64, os: macos-14, ext: tar.gz, link: static }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: rapidocrlite-sdk-${{ matrix.plat }}
          path: sdk-dist

      - name: Cache tiny models
        uses: actions/cache@v4
        with:
          path: ci-models
          key: rapidocr-ci-models-tiny-v1

      - name: Models and test image
        run: |
          set -euo pipefail
          python python/tests/fetch_ci_models.py
          python -m pip install -q Pillow
          python -c "from PIL import Image; Image.open('python/tests/data/hello.png').convert('RGB').save('hello.ppm')"

      - name: Extract SDK archive and check layout
        run: |
          set -euo pipefail
          ls -la sdk-dist
          ARCHIVE=$(ls sdk-dist/RapidOCRLite-SDK-${{ matrix.plat }}-*.${{ matrix.ext }})
          mkdir sdk
          if [ "${{ matrix.ext }}" = zip ]; then
            python - "$ARCHIVE" <<'PY'
          import sys, zipfile
          zf = zipfile.ZipFile(sys.argv[1])
          bad = [n for n in zf.namelist() if "\\" in n]
          assert not bad, f"backslash entries: {bad}"
          zf.extractall("sdk")
          PY
          else
            tar -xzf "$ARCHIVE" -C sdk
          fi
          SDK=$(cd sdk/RapidOCRLite-SDK-* && pwd)
          echo "SDK=$SDK" >> "$GITHUB_ENV"
          find "$SDK" | sort
          test -f "$SDK/README.md"
          test -f "$SDK/LICENSE"
          test -f "$SDK/include/rapidocrlite/rapidocrlite.h"
          test -f "$SDK/lib/cmake/RapidOCRLite/RapidOCRLiteConfig.cmake"
          test -f "$SDK/lib/cmake/ppocr/ppocrConfig.cmake"

      - name: Build example via find_package (CMAKE_PREFIX_PATH)
        run: |
          set -euo pipefail
          cmake -S examples/sdk_consumer -B consumer -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$SDK" -DPPOCR_SDK_LINK=${{ matrix.link }}
          cmake --build consumer --config Release
          EXE=$(find consumer -name 'sdk_consumer' -o -name 'sdk_consumer.exe' | head -1)
          test -n "$EXE"
          echo "EXE=$EXE" >> "$GITHUB_ENV"

      - name: Run OCR (CPU)
        run: |
          set -euo pipefail
          export PATH="$SDK/bin:$PATH"
          "$EXE" ci-models/PP-OCRv6_det_tiny.onnx ci-models/PP-OCRv6_rec_tiny.onnx \
            ci-models/ppocrv6_tiny_dict.txt hello.ppm "Hello" cpu | tee out.txt
          grep -q sdk_consumer_ok out.txt

      - name: Run OCR (Metal)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          "$EXE" ci-models/PP-OCRv6_det_tiny.onnx ci-models/PP-OCRv6_rec_tiny.onnx \
            ci-models/ppocrv6_tiny_dict.txt hello.ppm "Hello" metal | tee out.txt
          grep -q sdk_consumer_ok out.txt

      - name: Check shared library dependencies
        if: matrix.link == 'shared'
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            Linux) ldd "$EXE" ;;
            macOS) otool -L "$EXE"; otool -L "$SDK"/lib/librapidocrlite.*.dylib ;;
            Windows) objdump -p "$SDK/bin/rapidocrlite.dll" | grep "DLL Name" || true ;;
          esac

  attach-release:
    name: Attach SDKs to GitHub Release
    needs: [sdk-windows-x64, sdk-windows-x86, sdk-macos-arm64, sdk-linux-x86_64, sdk-linux-aarch64, sdk-linux-aarch64-qemu, sdk-smoke]
    if: >-
      always() &&
      needs.sdk-smoke.result == 'success' &&
      needs.sdk-windows-x64.result == 'success' &&
      needs.sdk-windows-x86.result == 'success' &&
      needs.sdk-macos-arm64.result == 'success' &&
      needs.sdk-linux-x86_64.result == 'success' &&
      (needs.sdk-linux-aarch64.result == 'success' || needs.sdk-linux-aarch64-qemu.result == 'success') &&
      (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v5')) ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rapidocrlite-sdk-*
          merge-multiple: true
          path: dist

      - name: List SDK archives
        run: |
          ls -la dist
          test "$(ls dist/RapidOCRLite-SDK-win32-* dist/RapidOCRLite-SDK-win_amd64-* dist/RapidOCRLite-SDK-macosx_arm64-* dist/RapidOCRLite-SDK-linux_x86_64-* dist/RapidOCRLite-SDK-linux_aarch64-* 2>/dev/null | wc -l)" -ge 5

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          # On a tag push this job can finish before build-wheels creates the
          # release ("release not found" on v5.0.0a7). Create it from the
          # existing tag if missing (never creates or moves a tag:
          # --verify-tag); build-wheels' action-gh-release then adds wheels to
          # the same release. Retry once in case both jobs race the create.
          case "$TAG" in *a*|*b*|*rc*) pre=--prerelease ;; *) pre= ;; esac
          for attempt in 1 2 3; do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then break; fi
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag $pre \
              --title "$TAG" --generate-notes && break
            sleep 20
          done
          # --clobber so re-dispatch can refresh assets on an existing release.
          gh release upload "$TAG" dist/RapidOCRLite-SDK-* --repo "$GITHUB_REPOSITORY" --clobber

      - uses: actions/checkout@v4

      - name: Refresh SHA256SUMS (wheels + sdist + SDKs)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: bash tools/release_sha256sums.sh "$TAG"
