name: build java

on:
  push:
    branches: [main]
    tags: ["v5*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: java-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Each job builds the JNI library natively on a real runner and runs a
  # smoke test (loads the JNI bridge + engine, queries CPU info through
  # JNI_OnLoad). The official SDK tarball is fetched from the RapidOCRLite
  # v5.0.0a10 release; zig (0.17.0) provides the Linux/macOS toolchains.
  # Each job uploads its native libraries so the package job below can
  # assemble the all-platform fat jar.

  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: mlugg/setup-zig@v1
        with:
          version: '0.17.0'
      - name: fetch SDK
        run: |
          mkdir -p java/sdk/linux_x86_64
          curl -sSL -o /tmp/sdk.tar.gz \
            https://github.com/RapidAI/RapidOCRLite/releases/download/v5.0.0a10/RapidOCRLite-SDK-linux_x86_64-5.0.0a10.tar.gz
          # The tarball has a top-level RapidOCRLite-SDK-linux_x86_64-5.0.0a10/
          # directory — extract as-is (no --strip-components): java/build.sh
          # expects sdk/<plat>/RapidOCRLite-SDK-<plat>-<ver>/.
          tar xzf /tmp/sdk.tar.gz -C java/sdk/linux_x86_64
      - name: build
        run: PLATFORMS=linux-x86_64 sh java/build.sh
      - name: smoke test
        run: java -Dsun.stdout.encoding=UTF-8 -jar java/dist/rapidocrlite-java-5.0.0a10.jar --cpu
      - uses: actions/upload-artifact@v4
        with:
          name: native-linux-x86_64
          path: java/build/native/linux-x86_64/
      - uses: actions/upload-artifact@v4
        with:
          name: jar-linux-x86_64
          path: java/dist/rapidocrlite-java-5.0.0a10.jar

  linux-aarch64:
    # Free for public repositories (GitHub-hosted arm64 Linux runners).
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: mlugg/setup-zig@v1
        with:
          version: '0.17.0'
      - name: fetch SDK
        run: |
          mkdir -p java/sdk/linux_aarch64
          curl -sSL -o /tmp/sdk.tar.gz \
            https://github.com/RapidAI/RapidOCRLite/releases/download/v5.0.0a10/RapidOCRLite-SDK-linux_aarch64-5.0.0a10.tar.gz
          tar xzf /tmp/sdk.tar.gz -C java/sdk/linux_aarch64
      - name: build
        run: PLATFORMS=linux-aarch64 sh java/build.sh
      - name: smoke test
        run: java -Dsun.stdout.encoding=UTF-8 -jar java/dist/rapidocrlite-java-5.0.0a10.jar --cpu
      - uses: actions/upload-artifact@v4
        with:
          name: native-linux-aarch64
          path: java/build/native/linux-aarch64/
      - uses: actions/upload-artifact@v4
        with:
          name: jar-linux-aarch64
          path: java/dist/rapidocrlite-java-5.0.0a10.jar

  macos-aarch64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: mlugg/setup-zig@v1
        with:
          version: '0.17.0'
      - name: fetch SDK
        run: |
          mkdir -p java/sdk/macosx_arm64
          curl -sSL -o /tmp/sdk.tar.gz \
            https://github.com/RapidAI/RapidOCRLite/releases/download/v5.0.0a10/RapidOCRLite-SDK-macosx_arm64-5.0.0a10.tar.gz
          tar xzf /tmp/sdk.tar.gz -C java/sdk/macosx_arm64
      - name: build
        run: PLATFORMS=macos-aarch64 sh java/build.sh
      - name: smoke test
        run: java -Dsun.stdout.encoding=UTF-8 -jar java/dist/rapidocrlite-java-5.0.0a10.jar --cpu
      - uses: actions/upload-artifact@v4
        with:
          name: native-macos-aarch64
          path: java/build/native/macos-aarch64/
      - uses: actions/upload-artifact@v4
        with:
          name: jar-macos-aarch64
          path: java/dist/rapidocrlite-java-5.0.0a10.jar

  win-x86_64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
          path-type: minimal
      - name: fetch SDK
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path java/sdk/win_amd64/bin, java/sdk/win_amd64/lib, java/sdk/win_amd64/include
          curl.exe -sSL -o sdk.zip https://github.com/RapidAI/RapidOCRLite/releases/download/v5.0.0a10/RapidOCRLite-SDK-win_amd64-5.0.0a10.zip
          Expand-Archive -Path sdk.zip -DestinationPath sdk_extract -Force
          $root = (Get-ChildItem -Directory sdk_extract | Select-Object -First 1).FullName
          Copy-Item "$root/bin/rapidocrlite.dll" java/sdk/win_amd64/bin/
          Copy-Item "$root/lib/rapidocrlite.lib" java/sdk/win_amd64/lib/
          Copy-Item -Recurse "$root/include/rapidocrlite" java/sdk/win_amd64/include/
      - name: build
        shell: msys2 {0}
        # build.sh normalizes a Windows-style JAVA_HOME (setup-java exports
        # C:\... paths) via cygpath before using $JAVA_HOME/bin/javac.
        run: PLATFORMS=win-x86_64 MINGW=/mingw64 sh java/build.sh
      - name: smoke test
        shell: bash
        run: java -Dsun.stdout.encoding=UTF-8 -jar java/dist/rapidocrlite-java-5.0.0a10.jar --cpu
      - uses: actions/upload-artifact@v4
        with:
          name: native-win-x86_64
          path: java/build/native/win-x86_64/
      - uses: actions/upload-artifact@v4
        with:
          name: jar-win-x86_64
          path: java/dist/rapidocrlite-java-5.0.0a10.jar

  # Merges the four per-platform native artifacts into the all-platform fat
  # jar. PACKAGE_ONLY=1 runs javac + jar only — no toolchains (zig/MinGW) or
  # SDK downloads needed on this runner. The smoke test proves the resulting
  # multi-platform jar picks the linux-x86_64 resources on this Linux runner.
  package:
    runs-on: ubuntu-latest
    needs: [linux-x86_64, linux-aarch64, macos-aarch64, win-x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # download-artifact@v4 with a wildcard pattern flattens every artifact
      # into one directory, so fetch each platform separately into its own
      # java/build/native/<platform>/ directory (layout build.sh expects).
      - uses: actions/download-artifact@v4
        with:
          name: native-linux-x86_64
          path: java/build/native/linux-x86_64
      - uses: actions/download-artifact@v4
        with:
          name: native-linux-aarch64
          path: java/build/native/linux-aarch64
      - uses: actions/download-artifact@v4
        with:
          name: native-macos-aarch64
          path: java/build/native/macos-aarch64
      - uses: actions/download-artifact@v4
        with:
          name: native-win-x86_64
          path: java/build/native/win-x86_64
      - name: package fat jar
        run: PACKAGE_ONLY=1 sh java/build.sh
      - name: smoke test
        run: java -Dsun.stdout.encoding=UTF-8 -jar java/dist/rapidocrlite-java-5.0.0a10.jar --cpu
      - uses: actions/upload-artifact@v4
        with:
          name: jar-all-platforms
          path: java/dist/rapidocrlite-java-5.0.0a10.jar
