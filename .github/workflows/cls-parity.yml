name: cls parity

# Text-line orientation classifier (Global.use_cls) parity with rapidocr
# main (RapidAI/RapidOCR @ 8ac45f4e, PR #748): build the CPU library, run
# RapidOCRLite and pip-installed rapidocr main on the README accuracy sets
# (SWHL text_det 212 pages / text_rec 310 crops) with use_cls on and off,
# compare image by image (also across AVX-512 / AVX2 / scalar), and upload
# the JSON dumps.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cls-parity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RAPIDOCR_MAIN_REF: 8ac45f4e731f50c37a1f5f9cf89294e08c1b2c15

jobs:
  parity:
    name: use_cls parity vs rapidocr main
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build cmake g++

      - name: Cache tiny models
        uses: actions/cache@v4
        with:
          path: ci-models
          key: rapidocr-ci-models-tiny-v1

      - name: Download tiny models when the cache is empty
        run: python python/tests/fetch_ci_models.py

      - name: Build the CPU library
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPPOCR_BUILD_STATIC=OFF -DPPOCR_BUILD_SHARED=ON \
            -DPPOCR_BUILD_TESTS=ON -DPPOCR_BUILD_EXAMPLES=OFF \
            -DPPOCR_ENABLE_VULKAN=OFF
          cmake --build build -j"$(nproc)"
          (cd build && ctest -R c_api_smoke --output-on-failure)

      - name: Python environments
        run: |
          python -m venv /tmp/lite
          /tmp/lite/bin/pip install -q numpy Pillow PyYAML requests tqdm pytest datasets
          python -m venv /tmp/main
          /tmp/main/bin/pip install -q "rapidocr @ git+https://github.com/RapidAI/RapidOCR@${RAPIDOCR_MAIN_REF}#subdirectory=python" onnxruntime datasets
          for v in /tmp/lite /tmp/main; do
            $v/bin/pip install -q text_det_metric==0.0.8 text_rec_metric==0.0.1 || echo "metrics packages unavailable"
          done
          /tmp/main/bin/python -c "import rapidocr, cv2, onnxruntime; print(rapidocr.__file__, cv2.__version__, onnxruntime.__version__)"

      - name: Library info
        run: |
          echo "PPOCR_LIBRARY=$PWD/build/librapidocrlite.so" >> "$GITHUB_ENV"
          PPOCR_LIBRARY=$PWD/build/librapidocrlite.so PYTHONPATH=python/src /tmp/lite/bin/python -c "from rapidocr import _native; print(_native.cpu_info())"

      - name: pytest (cls + compat) with the tiny models
        env:
          PYTHONPATH: python/src
          PPOCR_TEST_IMAGE: python/tests/data/hello.png
          PPOCR_TEST_DET: ci-models/PP-OCRv6_det_tiny.onnx
          PPOCR_TEST_REC: ci-models/PP-OCRv6_rec_tiny.onnx
          PPOCR_TEST_DICT: ci-models/ppocrv6_tiny_dict.txt
          PPOCR_CLS_MODEL: ci-models/ch_ppocr_mobile_v2.0_cls_mobile.onnx
        run: /tmp/lite/bin/python -m pytest -q python/tests/test_cls.py python/tests/test_main_compat.py

      - name: rapidocr main reference (use_cls on / off)
        run: |
          mkdir -p parity
          /tmp/main/bin/python tools/cls_parity/eval_acc.py parity/main_cls1.json --use-cls 1 --model-root /tmp/models-main
          /tmp/main/bin/python tools/cls_parity/eval_acc.py parity/main_cls0.json --use-cls 0 --model-root /tmp/models-main

      - name: RapidOCRLite (use_cls on / off, native ISA)
        env:
          PYTHONPATH: python/src
        run: |
          /tmp/lite/bin/python tools/cls_parity/eval_acc.py parity/lite_cls1.json --use-cls 1 --model-root /tmp/models-lite
          /tmp/lite/bin/python tools/cls_parity/eval_acc.py parity/lite_cls0.json --use-cls 0 --model-root /tmp/models-lite

      - name: RapidOCRLite under AVX2 and scalar
        env:
          PYTHONPATH: python/src
        run: |
          PPOCR_FORCE_ISA=avx2 /tmp/lite/bin/python tools/cls_parity/eval_acc.py parity/lite_cls1_avx2.json --use-cls 1 --model-root /tmp/models-lite
          PPOCR_FORCE_ISA=scalar /tmp/lite/bin/python tools/cls_parity/eval_acc.py parity/lite_cls1_scalar.json --use-cls 1 --limit-det 40 --limit-rec 100 --model-root /tmp/models-lite

      - name: Compare
        run: |
          set -o pipefail
          {
            echo "### use_cls on: rapidocr main vs RapidOCRLite"
            /tmp/main/bin/python tools/cls_parity/compare.py parity/main_cls1.json parity/lite_cls1.json parity/lite_cls1_avx2.json parity/lite_cls1_scalar.json || true
            echo "### use_cls off: rapidocr main vs RapidOCRLite"
            /tmp/main/bin/python tools/cls_parity/compare.py parity/main_cls0.json parity/lite_cls0.json || true
            echo "### RapidOCRLite before (cls off) vs after (cls on)"
            /tmp/main/bin/python tools/cls_parity/compare.py parity/lite_cls0.json parity/lite_cls1.json || true
            echo "### rapidocr main before vs after"
            /tmp/main/bin/python tools/cls_parity/compare.py parity/main_cls0.json parity/main_cls1.json || true
          } | tee parity/summary.txt
          echo '```' >> "$GITHUB_STEP_SUMMARY"; cat parity/summary.txt >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
          /tmp/main/bin/python tools/cls_parity/compare.py parity/main_cls1.json parity/lite_cls1.json --strict
          /tmp/main/bin/python tools/cls_parity/compare.py parity/lite_cls1.json parity/lite_cls1_avx2.json parity/lite_cls1_scalar.json --strict

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cls-parity
          path: parity/
