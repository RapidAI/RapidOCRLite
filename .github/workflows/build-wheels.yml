name: release

# NOTE: this file must stay named build-wheels.yml - it is the workflow name
# registered as the PyPI Trusted Publisher for project rapidocrlite
# (environment `pypi`). Renaming it breaks PyPI publishing.
#
# One pipeline for the whole release. Every push to main, PR and v5* tag push
# builds everything; only an (annotated) v5* tag push publishes:
#
#   * the C/C++ SDK archives  -> attached to the GitHub Release
#   * the Python wheels/sdist -> published to PyPI and attached to the Release
#   * the Java fat jar        -> attached to the same Release
#
# The release target is resolved by the `meta` job: a v5* tag push publishes to
# that tag (the release is created when missing, never left as a draft). Main
# pushes and PRs only build and test. A manual dispatch on a v5* tag ref can
# re-publish that tag. The workflow never creates, moves or deletes tags, and
# separate java-* tags are not needed. Keeping everything in a
# single workflow is what makes the ordering deterministic: the Java jobs can
# depend on the SDK artifacts of the very same run instead of racing a release
# that another workflow has not uploaded yet.
on:
  push:
    branches: [main]
    tags: ["v5*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI and the GitHub Release (only when run on a v5* tag)"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a release run: a half-finished upload leaves the release with
  # a partial asset list.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  meta:
    name: resolve release target
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      publish: ${{ steps.resolve.outputs.publish }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag / publish flag
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_PUBLISH: ${{ github.event.inputs.publish }}
        run: |
          set -euo pipefail
          version=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          case "$REF" in
            refs/tags/*) tag="$REF_NAME" ;;
            *) tag="v$version" ;;
          esac
          publish=false
          case "$EVENT" in
            push)
              case "$REF" in
                refs/tags/v5*) publish=true ;;
              esac
              ;;
            workflow_dispatch)
              case "$REF" in
                refs/tags/v5*) [ "$DISPATCH_PUBLISH" = "true" ] && publish=true || true ;;
              esac
              ;;
          esac
          if [ "$publish" = true ]; then
            git fetch --no-tags --force origin "+refs/tags/$tag:refs/tags/$tag"
            if [ "$(git cat-file -t "refs/tags/$tag")" != tag ]; then
              echo "::warning::$tag is a lightweight tag; release tags should be annotated (git tag -a)"
            fi
            if [ "v$version" != "$tag" ]; then
              echo "::error::tag $tag does not match pyproject.toml version $version" >&2
              exit 1
            fi
          fi
          echo "tag=$tag"
          echo "publish=$publish"
          echo "version=$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  sdk-windows-x64:
    name: SDK Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        shell: bash
        run: choco install ninja -y

      - name: Build and package SDK
        shell: bash
        run: |
          set -euo pipefail
          VER=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/prefix" \
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded \
            -DPPOCR_BUILD_SHARED=ON \
            -DPPOCR_BUILD_STATIC=ON \
            -DPPOCR_BUILD_EXAMPLES=OFF \
            -DPPOCR_BUILD_TESTS=OFF \
            -DPPOCR_ENABLE_VULKAN=ON \
            -DPPOCR_ENABLE_METAL=OFF
          cmake --build build -j"$(nproc 2>/dev/null || echo 4)"
          cmake --install build
          NAME="RapidOCRLite-SDK-win_amd64-${VER}"
          mkdir -p dist
          mv prefix "$NAME"
          python tools/zip_dir.py "$NAME" "dist/${NAME}.zip"
          ls -la dist
          test -f "dist/${NAME}.zip"

      - name: Lite engine regression (MSVC x64)
        shell: bash
        run: |
          set -euo pipefail
          python python/tests/fetch_ci_models.py
          cmake -S . -B build-test -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded \
            -DPPOCR_BUILD_SHARED=ON \
            -DPPOCR_BUILD_STATIC=OFF \
            -DPPOCR_BUILD_EXAMPLES=ON \
            -DPPOCR_BUILD_TESTS=ON \
            -DPPOCR_ENABLE_VULKAN=OFF \
            -DPPOCR_ENABLE_METAL=OFF
          cmake --build build-test -j"$(nproc 2>/dev/null || echo 4)" --target ppocr_lite_c_test ppocr_model_type_test ppocr_c_api_smoke
          export PATH="$PWD/build-test:$PATH"
          (cd build-test && ctest -R "lite_regress|model_type|c_api_smoke" --output-on-failure)
          # timing on the regression crop (not compared)
          printf 'crop %s\n' "$(cygpath -m "$PWD")/tests/data/lite_crop.ppm" > crop.list
          for t in 1 4; do ./build-test/ppocr_lite_c_test python/src/rapidocr/models/lite crop.list $t lite_t$t.json | tail -1; done
          PPOCR_FORCE_ISA=scalar ./build-test/ppocr_lite_c_test python/src/rapidocr/models/lite crop.list 4 lite_scalar.json | tail -1

      - uses: actions/upload-artifact@v4
        with:
          name: sdk-win_amd64
          path: dist/*.zip
          if-no-files-found: error

  sdk-windows-x86:
    name: SDK Windows x86 (win32)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Install Ninja
        shell: bash
        run: choco install ninja -y

      - name: Build and package SDK
        shell: bash
        run: |
